server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sécurité & Masquage de version
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression Gzip (performant et léger pour Raspberry Pi 5)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Gestion native de la page 404 personnalisée
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Cache des ressources statiques (CSS, JS, images, polices)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Route principale avec fallback 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoint léger de santé pour Docker healthcheck
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
